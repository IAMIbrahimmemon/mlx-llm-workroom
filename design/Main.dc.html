<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;}
.workroom{--bg:#FBFAF8;--surf:#FFFFFF;--surf2:#F4F1EC;--ink:#1B1917;--ink2:#56504A;--ink3:#8C857D;--line:#E7E2DA;--line2:#D6CFC4;--accent:#C0603A;--accentSoft:#FBEFE8;--accentRule:rgba(192,96,58,.22);--accentTrack:rgba(192,96,58,.18);--accentGlow:rgba(192,96,58,.34);--ok:#2E7D5B;--okSoft:#E8F2ED;--sh:0 1px 2px rgba(27,25,23,.05),0 10px 30px rgba(27,25,23,.06);}
.workroom.dark{--bg:#131211;--surf:#1C1A18;--surf2:#232120;--ink:#F3EFE9;--ink2:#B4ADA4;--ink3:#7E776E;--line:#2C2927;--line2:#3A3633;--accent:#E08A5E;--accentSoft:#2A1E18;--accentRule:rgba(224,138,94,.28);--accentTrack:rgba(224,138,94,.22);--accentGlow:rgba(224,138,94,.30);--ok:#5FB98F;--okSoft:#16241E;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--ink);}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.05);opacity:1;}}
@keyframes halo{0%{transform:scale(.92);opacity:.45;}70%{transform:scale(1.3);opacity:0;}100%{opacity:0;}}
@keyframes shim{from{transform:translateX(-110%);}to{transform:translateX(340%);}}
.r{animation:rise .7s cubic-bezier(.22,1,.36,1) both;}
</style>
</helmet>
<div class="workroom {{theme}}" style="width:1000px;height:700px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;position:relative;">
<div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 20px;flex-shrink:0;">
<div style="width:12px;height:12px;border-radius:50%;background:var(--line2);"></div>
<div style="width:12px;height:12px;border-radius:50%;background:var(--line2);"></div>
<div style="width:12px;height:12px;border-radius:50%;background:var(--line2);"></div>
</div>
<div style="flex:1;display:flex;align-items:center;padding:0 80px 40px;gap:64px;">

<div style="flex:1;display:flex;flex-direction:column;align-items:flex-start;">
<div class="r" style="animation-delay:.05s;display:flex;align-items:center;gap:10px;margin-bottom:34px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M9 15V9l3 3.6L15 9v6"></path></svg>
<span style="font-size:16px;font-weight:600;letter-spacing:-.01em;">Workroom</span>
<span style="font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:3px 8px;">Local</span>
</div>

<h1 class="r" style="animation-delay:.14s;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:76px;line-height:.98;letter-spacing:-.022em;margin:0 0 22px;text-wrap:balance;">AI should be<br>simple.</h1>

<p class="r" style="animation-delay:.24s;font-size:18px;line-height:1.55;color:var(--ink2);margin:0 0 38px;max-width:430px;text-wrap:pretty;">One capable model, running on your own Mac. No account to make, no key to paste, no meter running while you think.</p>

<div class="r" style="animation-delay:.34s;display:flex;align-items:center;gap:18px;">
<button style="height:46px;padding:0 26px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;cursor:pointer;box-shadow:var(--sh);">Get started</button>
<span style="font-size:14px;color:var(--ink3);">About two minutes</span>
</div>
</div>

<div style="width:300px;height:300px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;">
<div style="position:absolute;inset:0;border:1px solid var(--line);border-radius:50%;"></div>
<div style="position:absolute;inset:44px;border:1px solid var(--line);border-radius:50%;"></div>
<div style="position:absolute;inset:88px;border:1px solid var(--line2);border-radius:50%;"></div>
<div style="position:absolute;width:124px;height:124px;border-radius:50%;background:var(--accent);opacity:.16;animation:halo 4.6s ease-out infinite;"></div>
<div style="position:relative;width:74px;height:74px;border-radius:50%;background:var(--accent);animation:breathe 4.6s ease-in-out infinite;box-shadow:0 8px 28px var(--accentGlow);"></div>
<div style="position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);">Apple MLX &middot; on device</div>
</div>

</div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
