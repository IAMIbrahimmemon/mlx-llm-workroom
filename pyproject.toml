[project]
name = "workroom"
version = "0.1.0"
description = "A local computer-use agent that runs entirely on an Apple-silicon Mac."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-vlm>=0.3.6",
    "mlx-lm>=0.28.6",
    "huggingface-hub>=0.35.0",
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-ApplicationServices>=11.0",
    "pyobjc-framework-Cocoa>=11.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "rich>=13.9",
    "rapidfuzz>=3.10",
    "httpx>=0.28",
]

[project.scripts]
workroom = "agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
